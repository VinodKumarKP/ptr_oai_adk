# Prometheus configuration for the OAI Agent Registry observability stack.
# Mounted into the `prometheus` service (see docker-compose.yaml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'oai-agent-registry'

scrape_configs:
  # Prometheus self-monitoring.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Jaeger's own internal telemetry. The v1 admin/metrics port (:14269) was
  # removed in Jaeger v2. v2 (OTel-Collector based) exposes service telemetry on
  # :8888 only when enabled in its config; uncomment once you expose it:
  # - job_name: 'jaeger'
  #   static_configs:
  #     - targets: ['jaeger:8888']

  # Auto-discover agent containers deployed by the registry via the Docker API.
  # Every agent container is labelled (oai.scrape / oai.metrics.port /
  # oai.metrics.path) by the registry's compose generator, so newly deployed
  # agents are scraped automatically on the next discovery refresh — no edits
  # to this file are needed.
  - job_name: 'oai-agents'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Keep only containers that opted in to scraping.
      - source_labels: [__meta_docker_container_label_oai_scrape]
        regex: 'true'
        action: keep
      # Scrape <container_ip>:<metrics_port> on the agent network.
      - source_labels:
          - __meta_docker_network_ip
          - __meta_docker_container_label_oai_metrics_port
        separator: ':'
        target_label: __address__
      # Honour a custom metrics path if set (defaults to /metrics).
      - source_labels: [__meta_docker_container_label_oai_metrics_path]
        regex: '(.+)'
        target_label: __metrics_path__
      # Friendly labels: agent service name + container name.
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: agent
      - source_labels: [__meta_docker_container_name]
        regex: '/?(.*)'
        target_label: container
