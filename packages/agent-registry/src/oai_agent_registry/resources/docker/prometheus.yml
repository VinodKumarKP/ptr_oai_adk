# Prometheus configuration for the OAI Agent Registry observability stack.
# Mounted into the `prometheus` service (see docker-compose.yaml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'oai-agent-registry'

scrape_configs:
  # Prometheus self-monitoring.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Jaeger's own internal telemetry. The v1 admin/metrics port (:14269) was
  # removed in Jaeger v2. v2 (OTel-Collector based) exposes service telemetry on
  # :8888 only when enabled in its config; uncomment once you expose it:
  # - job_name: 'jaeger'
  #   static_configs:
  #     - targets: ['jaeger:8888']

  # Agents are discovered from a target file the registry maintains. The registry
  # is the single source of truth for every agent's endpoint — whether it deployed
  # the agent as a container or it was registered externally via /register — and
  # rewrites this file on register/deregister/startup. Newly registered agents are
  # picked up on the next refresh; no edits to this file are needed.
  - job_name: 'oai-agents'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/agents.json
        refresh_interval: 15s
    metrics_path: /metrics
