# Grafana data sources, auto-provisioned on container start.
# URLs use the compose service names on 'agent-server-network' (NOT localhost,
# which inside the Grafana container points at Grafana itself).

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
