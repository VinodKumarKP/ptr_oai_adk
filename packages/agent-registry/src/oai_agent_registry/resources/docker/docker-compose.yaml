name: agent-registry
services:
  base:
    build:
      context: .
      dockerfile: Dockerfile.base
      secrets:
        - github_token
    image: oai-adk-base-image:latest
  base-langgraph:
    build:
      context: .
      dockerfile: Dockerfile.framework_base
      args:
        FRAMEWORK_PACKAGE: oai-langgraph-core
        FRAMEWORK_SUBDIR: packages/langgraph-core
        ADK_VERSION: main
    image: oai-adk-langgraph-base-image:latest
    depends_on:
      base:
        condition: service_completed_successfully
  base-crewai:
    build:
      context: .
      dockerfile: Dockerfile.framework_base
      args:
        FRAMEWORK_PACKAGE: oai-crewai-core
        FRAMEWORK_SUBDIR: packages/crewai-core
        ADK_VERSION: main
    image: oai-adk-crewai-base-image:latest
    depends_on:
      base:
        condition: service_completed_successfully
  base-strands:
    build:
      context: .
      dockerfile: Dockerfile.framework_base
      args:
        FRAMEWORK_PACKAGE: oai-aws-strands-core
        FRAMEWORK_SUBDIR: packages/aws-strands-core
        ADK_VERSION: main
    image: oai-adk-strands-base-image:latest
    depends_on:
      base:
        condition: service_completed_successfully
  base-openai:
    build:
      context: .
      dockerfile: Dockerfile.framework_base
      args:
        FRAMEWORK_PACKAGE: oai-openai-core
        FRAMEWORK_SUBDIR: packages/openai-core
        ADK_VERSION: main
    image: oai-adk-openai-base-image:latest
    depends_on:
      base:
        condition: service_completed_successfully
  valkey:
    image: valkey/valkey:latest
    container_name: agent-valkey
    environment:
      REDIS_PASSWORD: admin
    networks:
      agent-server-network:
        ipv4_address: 172.25.0.11
    extra_hosts:
      - host.docker.internal:host-gateway
    command: valkey-server --appendonly yes
    ports:
      - 6379:6379
    volumes:
      - valkey-agent-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - admin
        - ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
  postgres:
    image: postgres:16
    container_name: agent_logs_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_logs
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
      - -c
      - effective_io_concurrency=200
    networks:
      agent-server-network:
        ipv4_address: 172.25.0.10
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: agent-jaeger
    networks:
      agent-server-network:
        ipv4_address: 172.25.0.12
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 16686:16686
      - 4317:4317
      - 4318:4318
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    container_name: agent-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    networks:
      agent-server-network:
        ipv4_address: 172.25.0.13
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - ./targets:/etc/prometheus/targets:ro
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    container_name: agent-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
    networks:
      agent-server-network:
        ipv4_address: 172.25.0.14
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped
networks:
  agent-server-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
volumes:
  valkey-agent-data: {}
  postgres_data: {}
  prometheus_data: {}
  grafana_data: {}
secrets:
  github_token:
    environment: GITHUB_TOKEN
