# KB Registry — infrastructure services
#
# Startup phases
# --------------
# Phase 1 — always started at process startup (--auto-start-infra):
#   postgres  — metadata DB (KB registry log, document tracking)   port 5436
#   valkey    — token / session store                              port 6383
#
# Phase 2 — started on-demand at first KB registration of that type:
#   pgvector  — builtin Postgres+pgvector vector store             port 5435
#                 started when: vector_db_type=postgres, deployment_mode=builtin
#   chromadb  — builtin ChromaDB HTTP server                       port 8010
#                 started when: vector_db_type=chroma,   deployment_mode=builtin
#
# 's3' type KBs need no container — they use the AWS S3 API directly.
# 'external' deployment mode KBs use user-managed infrastructure — these
#   containers are never touched for external deployments.
#
# Environment variables read by the KB registry app:
#   LOGGING_DB_HOST / LOGGING_DB_PORT     — metadata postgres connection
#   LOGGING_DB_USER / LOGGING_DB_PASSWORD — metadata postgres credentials
#   KB_POSTGRES_URL  — pgvector connection string (builtin postgres vector store)
#   KB_PGVECTOR_HOST — pgvector host for readiness check  (default: localhost)
#   KB_PGVECTOR_PORT — pgvector port for readiness check  (default: 5435)
#   KB_CHROMA_HOST   — chromadb host for readiness check  (default: localhost)
#   KB_CHROMA_PORT   — chromadb port for readiness check  (default: 8010)
#   KB_S3_BUCKET     — S3 bucket for builtin s3 vector store
#   REDIS_HOST / REDIS_PORT — Valkey connection

name: kb-registry

services:
  # ---- Metadata database (KB registry log, document tracking) --------
  postgres:
    image: postgres:16
    container_name: kb_registry_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kb_logs}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    ports:
      - "5436:5432"
    volumes:
      - kb_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      kb-network:
        ipv4_address: "172.29.0.10"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ---- pgvector (builtin Postgres vector store) -----------------------
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: kb_pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${VECTOR_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: kb_vectors
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    ports:
      - "5435:5432"
    volumes:
      - kb_pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      kb-network:
        ipv4_address: "172.29.0.11"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ---- ChromaDB (builtin Chroma vector store) -------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: kb_chromadb
    environment:
      IS_PERSISTENT: "TRUE"
      CHROMA_SERVER_AUTHN_CREDENTIALS: ${CHROMA_TOKEN:-}
      CHROMA_SERVER_AUTHN_PROVIDER: ${CHROMA_AUTH_PROVIDER:-}
    ports:
      - "8010:8000"
    volumes:
      - kb_chroma_data:/chroma/chroma
    restart: unless-stopped
    networks:
      kb-network:
        ipv4_address: "172.29.0.12"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 15s

  # ---- Valkey (token store) -------------------------------------------
  valkey:
    image: valkey/valkey:latest
    container_name: kb_valkey
    command: valkey-server --appendonly yes
    ports:
      - "6383:6379"
    volumes:
      - kb_valkey_data:/data
    restart: unless-stopped
    networks:
      kb-network:
        ipv4_address: "172.29.0.13"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

networks:
  kb-network:
    driver: bridge
    ipam:
      config:
        - subnet: "172.29.0.0/16"

volumes:
  kb_postgres_data: {}
  kb_pgvector_data: {}
  kb_chroma_data: {}
  kb_valkey_data: {}
