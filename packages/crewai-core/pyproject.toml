[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "oai-crewai-core"
description = "OAI CrewAI Agent core"
authors = [{name = "Vinod Kumar KP", email = "vinod.kunnum-purath@capgemini.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agent", "oai_crewai_agent_core", "crewai"]
dynamic = ["scripts", "version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "oai-agent-core",
    "crewai==1.6.1",
    "crewai-tools[mcp]==1.6.1",
    "crewai[bedrock]",
    "langfuse==3.10.1",
    "openlit==1.34.30",
    "litellm==1.80.0",
]

[project.optional-dependencies]
# Vector-related dependencies
chromadb = [
    "oai-agent-core[vector-required]",
    "chromadb==1.1.1"
]

postgres = [
    "oai-agent-core[postgres]",
]

s3 = [
    "oai-agent-core[s3]",
]

guardrails = [
    "oai-agent-core[guardrails-ai]"
]

# All optional dependencies
all = [
    "oai-crewai-core[chromadb]",
    "oai-agent-core[guardrails]"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/oai_agent_core"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "strict"
