[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "oai-skills-registry"
version = "1.0.0"
description = "A FastAPI-based Skills Registry for managing agent skills with Git integration and manual lifecycle control."
authors = [{ name = "Vinod Kumar KP", email = "vinod.kunnum-purath@capgemini.com" }]
maintainers = [{ name = "Development Team" }]
license = { text = "Proprietary" }
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "skills-registry",
    "skills",
    "fastapi",
    "git",
    "lifecycle",
    "versioning",
    "agent"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Software Distribution",
    "Typing :: Typed",
]

# Core dependencies
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "PyYAML>=6.0.1",
    "aiohttp>=3.9.1",
    "httpx>=0.25.0",
    "oai-platform-core",
]

# Optional dependencies
[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
]
sqlite = [
    "aiosqlite>=0.19.0",
]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "flake8>=6.1.0",
    "isort>=5.13.0",
    "mypy>=1.7.0",
]
all = [
    "oai-skills-registry[postgres,sqlite,dev]",
]

[project.urls]
Homepage = "https://github.com/Capgemini-Innersource/ptr_agent_server"
Repository = "https://github.com/Capgemini-Innersource/ptr_agent_server.git"
Issues = "https://github.com/Capgemini-Innersource/ptr_agent_server/issues"
Documentation = "https://github.com/Capgemini-Innersource/ptr_agent_server/tree/main/packages/skills-registry"

[project.scripts]
oai-skills-registry = "oai_skills_registry.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/oai_skills_registry"]

# PyTest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=src/oai_skills_registry --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
asyncio_mode = "strict"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Code Quality Tools
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "aiosqlite.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/oai_skills_registry"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
]
