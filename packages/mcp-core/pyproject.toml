# pyproject.toml
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "oai-mcp-server-core"
description = "OAI MCP Server core"
authors = [{name = "Vinod Kumar KP", email = "vinod.kunnum-purath@capgemini.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["mcp", "mcp-server-core", "oai-mcp-server-core"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp==2.14.1",
    "nest-asyncio",
    "ruamel.yaml",
    "requests",
    "oai-platform-core[redislite]",
    "fastapi==0.136.1",
    "pydantic-settings==2.14.2"
]


[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/Capgemini-Innersource/ptr_mcp_server_core"
Repository = "https://github.com/Capgemini-Innersource/ptr_mcp_server_core.gi"
Issues = "https://github.com/Capgemini-Innersource/ptr_mcp_server_core/issues"

[project.scripts]
mcp_server_executor="oai_mcp_server_core.core.mcp_server_executor:main"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "strict"

