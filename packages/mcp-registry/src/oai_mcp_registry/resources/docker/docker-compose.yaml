services:
  base:
    build:
      context: .
      dockerfile: Dockerfile.base
      secrets:
        - github_token
    image: oai-adk-mcp-base-image:latest
  valkey:
    image: valkey/valkey:latest
    container_name: mcp-valkey
    environment:
      REDIS_PASSWORD: admin
    networks:
      - mcp-server-network
    command: valkey-server --appendonly yes
    ports:
      - 6379:6379
    volumes:
      - valkey-mcp-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - admin
        - ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
  postgres:
    image: postgres:16
    container_name: mcp_logs_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcp_logs
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
      - -c
      - effective_io_concurrency=200
    networks:
      - mcp-server-network
    ports:
      - 5432:5432
    volumes:
      - mcp_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
networks:
  mcp-server-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16
volumes:
  valkey-mcp-data: {}
  mcp_postgres_data: {}
secrets:
  github_token:
    environment: GITHUB_TOKEN
