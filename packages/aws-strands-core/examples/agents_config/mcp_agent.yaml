model:
  model_id: bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0
  region_name: us-west-2

tools:
  utils:
    module: demo_tools
    base_path: "./utils"

mcps:
  environment_lookup:
    command: env_lookup_server
    args: []
  stock_market_lookup:
    command: stock_market_server
    args: []
  customer_records_server:
    command: customer_records_server
    args: []


agent_list:
  - env_lookup_assistant:
      system_prompt: |
        You are a environment lookup assistant
      mcps:
        - environment_lookup
        - stock_market_lookup
        - customer_records_server
      tools:
        - search_flights
        - search_hotels
        - book_hotel
        - book_flight

crew_config:
  pattern: single
  enable_lazy_loading: true
