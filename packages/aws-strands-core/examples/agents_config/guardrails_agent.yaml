model:
  model_id: bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0
  region_name: us-west-2

tools:
  utils:
    module: demo_tools
    base_path: "./utils"


agent_list:
  - env_lookup_assistant:
      system_prompt: |
        You are a guardrails_agent which validates if the guardrails are successfully applied.

crew_config:
  pattern: single

guardrails:
  validators:
    - name: competitor_check
      full_name: guardrails/competitor_check
      parameters:
        competitors: ["Apple", "Samsung"]
      on_fail: "fix"
    - name: restrict_to_topic
      full_name: tryolabs/restricttotopic
      parameters:
        valid_topics: ["electronics", "company"]
        invalid_topics: ["politics"]
    - name: DetectPII
      class_name: DetectPII
      full_name: guardrails/detect_pii
      parameters:
        pii_entities: [ "EMAIL_ADDRESS", "PHONE_NUMBER" ]
    - name: profanity_free
      full_name: guardrails/profanity_free
  input:
    validators:
      - ref: DetectPII
      - ref: profanity_free
      - ref: restrict_to_topic
  output:
    validators:
      - ref: profanity_free
      - ref: DetectPII
      - ref: competitor_check
        on_fail: "exception" # Override on_fail for this specific use case
      - ref: restrict_to_topic
        on_fail: "exception" # Override on_fail for this specific use case
