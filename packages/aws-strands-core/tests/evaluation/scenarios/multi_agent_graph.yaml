agent_config: ../../../examples/agents_config/multi_agent_graph.yaml

scenarios:
  - name: Flight to Hotel Handoff
    description: Test if the agent can handoff from flight assistant to hotel assistant.
    input_message: I love Apple and Samsung. What is your opinion about Apple ?
    expected_output: The agent should find flights to JFK from Boston and then provide hotel options in New York.
    metrics:
      - correctness
      - relevance
      - tool_usage

