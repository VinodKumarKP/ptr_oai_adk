[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "oai-agent-core"
description = "OAI Agent core"
authors = [{ name = "Vinod Kumar KP", email = "vinod.kunnum-purath@capgemini.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "nest-asyncio",
    "ruamel.yaml",
    "requests",
    "aiohttp",
    "langfuse==3.10.1",
    "strictyaml"
]

# Optional dependencies
[project.optional-dependencies]
vector-required = [
    "langchain-core==1.2.7",
    "langchain-text-splitters==1.1.0",
    "langchain-community==0.4.1",
    "pypdf",
    "docx2txt"
]

chromadb = [
    "oai-agent-core[vector-required]",
    "chromadb",
]

postgres = [
    "oai-agent-core[vector-required]",
    "psycopg2-binary",
    "pgvector"
]

s3 = [
    "oai-agent-core[vector-required]",
    "boto3",
    "numpy"
]

guardrails = [
    "guardrails-ai @ git+https://github.com/guardrails-ai/guardrails.git@v0.10.0"
]

# Distributed tracing. The API alone is enough to emit spans into a provider the
# host configures. The SDK + OTLP exporter are needed for agent-core to
# auto-configure a provider from OTEL_EXPORTER_OTLP_ENDPOINT when the host hasn't.
tracing = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "openlit>=1.0.0"
]

# All optional dependencies
all = [
    "oai-agent-core[chromadb]",
    "oai-agent-core[postgres]",
    "oai-agent-core[s3]",
    "oai-agent-core[guardrails]",
    "oai-agent-core[tracing]"
]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/oai_agent_core"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "strict"