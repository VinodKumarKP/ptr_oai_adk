name: Intelligent Release Decisioning
description: AI-powered release decision coordinator that orchestrates multiple specialized agents to analyze code quality, security vulnerabilities, test results, and provides intelligent deployment readiness assessments with automated ticket creation
type: multi-agent
port: 8102
instructions: |
  This agent will analyze the code scan result of the provided project and summarize the results. Based on that analysis, provide a list of recommended actions 
  and also indicate whether the project is ready for deployment or not.
  
  User can select from following level of report:
    - Summary Report
    - Detailed Report
source: https://github.com/Capgemini-Innersource/ptr_agents_devops.git
tags:
  - release manager
  - multi-agent
prompts:
  - "Analyze project readiness for production deployment with comprehensive assessment"
  - "Review code scan results and test coverage to determine deployment readiness"
  - "Evaluate security vulnerabilities and test results for release decision"
  - "Assess overall project quality and provide deployment recommendation"
  - "Coordinate full project analysis and create deployment readiness report"