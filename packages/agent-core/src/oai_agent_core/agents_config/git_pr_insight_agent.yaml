name: Git PR Insights
description: GitHub pull request intelligence platform that provides comprehensive PR analysis including code changes, contributor insights, review status, quality metrics, and actionable recommendations for improved code collaboration
type: mcp
cloud_provider: aws
port: 8109
instructions: |
  Please provide the GitHub repository URL and the pull request number. The agent will analyze the pull request and generate insights including:
    - list of changed files
    - summary of code changes
    - contributors and reviewers
    - review status and comments
    - code quality and potential issues

  You may select specific insights from advanced options. By default, all insights are provided.
source: https://github.com/Capgemini-Innersource/ptr_agents_devops.git
tags:
  - git
  - pr
  - pull-request
  - insight
  - analyze
prompts:
  - "Analyze pull request #123 in https://github.com/VinodKumarKP/python_project repository"
  - "Review PR #456 in https://github.com/VinodKumarKP/python_project and provide code quality insights"
  - "Examine pull request #789 in https://github.com/VinodKumarKP/python_project for review status"
  - "Analyze PR #101 in https://github.com/VinodKumarKP/python_project and summarize changes"
  - "Review pull request #202 in https://github.com/VinodKumarKP/python_project for contributor insights"