name: AWS Strands Swarm Research Agent
description: Distributed research intelligence system utilizing AWS Strands LLMs in swarm orchestration patterns to conduct parallel topic analysis, coordinate multi-source information gathering, and generate comprehensive research deliverables through collaborative agent networks
type: aws-strands
cloud_provider: aws
port: 8117
instructions: |
  This agent utilizes AWS Strands LLMs to conduct research on various topics using a swarm pattern. The agent can perform tasks such as:

    - Gathering information from multiple sources
    - Analyzing and synthesizing data
    - Creating connections between related concepts
    - Generating comprehensive reports based on the research findings

  Users can input their research topics, and the agent will explore the subject matter in depth using its multi-agent capabilities.
source: https://github.com/Capgemini-Innersource/ptr_aws_strands_agents.git
tags:
  - aws-strands
  - swarm
  - research
  - multi-agent

prompts:
  - "Research cloud computing adoption in healthcare and analyze implementation challenges"
  - "Investigate blockchain applications in supply chain management with detailed analysis"
  - "Study the impact of 5G technology on IoT device proliferation"
  - "Analyze the current state of edge computing and its future prospects"
  - "Research sustainable technology practices in enterprise environments"