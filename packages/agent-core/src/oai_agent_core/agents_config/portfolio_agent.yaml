  - "What's the current market outlook for tech stocks?"
  - "My account number is 1002. Help me rebalance my portfolio for better diversification"
  - "My account number is 1002. Recommend 5 stocks for long-term growth with risk analysis"
  - "My account number is 1001. Review my account holdings and suggest optimization strategies"

