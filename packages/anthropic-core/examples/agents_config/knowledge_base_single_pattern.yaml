model:
  model_id: bedrock-claude-sonnet-4.6
  region_name: us-west-2

agent_list:
  - rag_assistant:
      system_prompt: |
        You are a helpful assistant who can answer questions using knowledge bases.
        Use the search tools to find information in the knowledge bases.
      knowledge_base:
        - name: insurance_policies
          description: "Search insurance policy documents"
          vector_store:
            type: chroma
            settings:
              collection_name: "insurance_policies"
              persist_directory: "./rag_db_single"
          embedding:
            model_id: "bedrock/amazon.titan-embed-text-v1"
            region_name: "us-west-2"
          data_sources:
            - path: "docs/sample_policy.pdf"
          text_splitter:
            type: "recursive_character"
            chunk_size: 1000
            chunk_overlap: 200
          retrieval_settings:
            top_k: 5
            score_threshold: 0.7

        - name: leave_policies
          description: "Search company leave policy"
          vector_store:
            type: chroma
            settings:
              collection_name: "leave_policies"
              persist_directory: "./rag_db_single2"
          embedding:
            model_id: "bedrock/amazon.titan-embed-text-v1"
            region_name: "us-west-2"
          data_sources:
            - path: "docs/leave_policy.pdf"
          text_splitter:
            type: "recursive_character"
            chunk_size: 1000
            chunk_overlap: 200
          retrieval_settings:
            top_k: 5
            score_threshold: 0.7

crew_config:
  pattern: single
