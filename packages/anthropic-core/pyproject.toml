[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "oai-anthropic-core"
description = "OAI Anthropic agent core — LiteLLM-backed Anthropic agent with single, supervisor, agent-as-tool, and extended-thinking patterns"
authors = [{ name = "Vinod Kumar KP", email = "vinod.kunnum-purath@capgemini.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
keywords = ["agent", "anthropic", "claude", "oai-anthropic-core"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "oai-agent-core",
    "claude-agent-sdk>=0.2.87",  # Anthropic Agent SDK — built-in agentic loop, subagents, MCP, hooks
    "litellm>=1.80.0",           # LiteLLM proxy — routes to Bedrock / Vertex / Anthropic API
    "mcp>=1.0.0",
    "langfuse>=3.10.1",
    "openlit>=1.34.30",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
chromadb = [
    "oai-agent-core[vector-required]",
    "chromadb",
]

postgres = [
    "oai-agent-core[postgres]",
]

s3 = [
    "oai-agent-core[s3]",
]

pinecone = [
    "oai-agent-core[pinecone]",
]

# Neo4j knowledge-graph support (GraphRAG)
neo4j = [
    "oai-agent-core[neo4j]",
]

guardrails = [
    "oai-agent-core[guardrails-ai]",
]

all = [
    "oai-agent-core[vector]",
    "oai-agent-core[neo4j]",
    "oai-agent-core[guardrails]",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/oai_agent_core"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "strict"
