# pyproject.toml
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "oai-agent-server"
description = "OAI Agent Server - FastAPI based server for OAI Agents"
authors = [{ name = "Vinod Kumar KP", email = "vinod.kunnum-purath@capgemini.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agent", "agent-server", "oai-agent-server", "fastapi"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Base dependencies
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "oai-platform-core[redislite]",
    "asyncpg",
    "aiosqlite",
    "oai-agent-core",
    "a2a-sdk[http-server]==1.0.2",
    "slowapi>=0.1.9",
    "python-json-logger>=2.0",
    "PyJWT==2.11.0",
    "python-multipart==0.0.22"
]

[project.optional-dependencies]
sqlite = ["aiosqlite"]
postgres = ["asyncpg"]
a2a = ["a2a-sdk[http-server]==1.0.2"]
scheduler = ["apscheduler"]
# OpenTelemetry tracing + Prometheus metrics for the server's ObservabilityManager:
# OTLP span export to Jaeger/collector, FastAPI/requests auto-instrumentation, and
# the prometheus_client backing the /metrics endpoint.
observability = [
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-exporter-otlp==1.42.1",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-requests==0.63b1",
    "prometheus-client==0.24.1",
]
all = [
    "aiosqlite",
    "asyncpg",
    "a2a-sdk[http-server]==1.0.2",
    "apscheduler",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-exporter-otlp==1.42.1",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-requests==0.63b1",
    "prometheus-client==0.24.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/Capgemini-Innersource/ptr_agent_server"
Repository = "https://github.com/Capgemini-Innersource/ptr_agent_server.git"
Issues = "https://github.com/Capgemini-Innersource/ptr_agent_server/issues"


[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "strict"
