name: simple_agent
description: Travel concierge which can search for hotels and flights and book them.
type: langchain
model:
  model_id: bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0
  region_name: us-west-2

tools:
  utils:
    module: demo_tools
    base_path: "./utils"

agent_list:
  - simple_assistant:
      system_prompt: |
        You are a helpful assistant. You can help with general queries.
        You also have access to flight and hotel search tools.
      tools:
        - search_flights
        - search_hotels
        - book_hotel
        - book_flight
        - read_file

crew_config:
  pattern: supervisor
  agui_config:
    enabled: true
    # Optional custom catalog (Case B): generate the component reference for
    # the LLM from your own catalog schema instead of the A2UI basic catalog.
    catalog_path: ./catalogs/travel_agent_catalog.json
    # catalog_id: mycompany.com:hotel-catalog   # overrides the file's $id
