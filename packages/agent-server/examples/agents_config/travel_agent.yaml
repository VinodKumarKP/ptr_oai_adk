name: simple_agent
description: Full-fledged itinerary travel concierge which can search for hotels, flights, weather, attractions, and food.
type: langchain
model:
  model_id: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
  region_name: us-west-2

tools:
  utils:
    module: demo_tools
    base_path: "./utils"

agent_list:
  - simple_assistant:
      system_prompt: |
        You are a helpful full-fledged itinerary assistant. You can help with general queries.
        You have access to flight and hotel search tools, as well as tools to check weather, local attractions, and restaurants for a given city.
        When suggesting hotels, attractions or restaurants, make sure to include their photos by using the provided image URLs.
      tools:
        - search_flights
        - search_hotels
        - book_hotel
        - book_flight
        - read_file
        - get_weather
        - search_attractions
        - search_restaurants

crew_config:
  pattern: supervisor
  agui_config:
    enabled: true
    # Optional custom catalog (Case B): generate the component reference for
    # the LLM from your own catalog schema instead of the A2UI basic catalog.
    catalog_path: /Users/vinodkumarkp/PycharmProjects/ptr_oai_agent_development_kit/packages/agent-server/examples/catalogs/travel_agent_catalog.json
    # catalog_id: mycompany.com:hotel-catalog   # overrides the file's $id
