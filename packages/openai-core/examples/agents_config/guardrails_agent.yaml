model:
  model_id: bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0
  region_name: us-west-2

tools:
  utils:
    module: demo_tools
    base_path: "./utils"


agent_list:
  - env_lookup_assistant:
      system_prompt: |
        You are a guardrails_agent which validates if the guardrails are successfully applied.

crew_config:
  pattern: single

guardrails:
  enable_agent_validation: false
  custom_validators_dir: "custom_guardrails"
  validators:
    - name: competitor_check
      full_name: guardrails/competitor_check
      parameters:
        competitors: [ "Apple", "Samsung" ]
      on_fail: "fix"

    - name: RestrictToTopic
      full_name: tryolabs/restricttotopic
      parameters:
        valid_topics: [ "sports" ]

    - name: DetectPII
      full_name: guardrails/detect_pii
      parameters:
        pii_entities: ["EMAIL_ADDRESS", "PHONE_NUMBER"]

    - name: profanity_free
      full_name: guardrails/profanity_free


#    - name: json_validator
#      full_name: ValidJson
#      module: valid_json
#      on_fail: "noop"
#      instruction: Response should be a valid json # Optional instruction
  input:
    validators:
      - ref: competitor_check
  output:
    validators:
      - ref: competitor_check
      - ref: json_validator
      - ref: RestrictToTopic
