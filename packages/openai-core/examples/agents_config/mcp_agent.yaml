model:
  model_id: bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0
  region_name: us-west-2

tools:
  utils:
    module: demo_tools
    base_path: "./utils"

mcps:
  environment_lookup:
    command: env_lookup_server
  stock_market_lookup:
    command: stock_market_server
  customer_records_server:
    command: customer_records_server

#    args:
#      - run
#      - --with
#      - "git+https://github.com/Capgemini-Innersource/ptr-cloud-mcp-servers.git"
#      - env_lookup_server


agent_list:
  - env_lookup_assistant:
      system_prompt: |
        You are an environment lookup assistant.

      mcps:
        - environment_lookup
        - customer_records_server
        - stock_market_lookup
      tools:
        - search_flights
        - search_hotels
        - book_hotel

crew_config:
  pattern: single
  enable_lazy_loading: true
