agent_config: ../../../examples/agents_config/simple_agent.yaml
agent_class: oai_agent_core.openai_core.agents.openai_agent.OpenAIAgent
judge_model_id: 'bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0'

scenarios:
  - name: Simple Greeting
    description: Test if the agent can greet the user.
    input_message: Hello, summarize the following text {{ OPEN ./docs/article.txt }} and say hello to {{ FAKER_LOCALE en_IN name }} who has ssn {{ FAKER ssn }}
    expected_output: I am a helpful assistant.

  - name: Book a hotel
    description: Test if the agent successfully book the hotel
    input_message: Book a hotel in New York with user {{ FAKER name }} and hotel - McKittrick Hotel. Book without my confirmation
    expected_output: Agent should successfully book the hotel

  - name: Book a flight and hotel
    description: Test if the agent successfully book the hotel and flight
    input_message: Book a flight from BOS to JFK for {{ DATE %Y-%m-%d 1 }} and book a hotel in New York. Use user id 1 for both the bookings
    expected_output: Agent should successfully book the hotel and the flight
    metrics:
      - correctness
      - tool usage

  - name: Flight Search - Not Found
    description: Test agent behavior when no flights are found.
    input_message: Find flights from BOS to LHR for {{ DATE %Y-%m-%d 1 }}.
    expected_output: The agent should inform the user that no flights were found for that route and date.
    metrics:
      - correctness
      - relevance
