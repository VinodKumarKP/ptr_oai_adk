# pyproject.toml
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "oai-agent-evaluator"
description = "OAI Agent Evaluator"
authors = [{name = "Vinod Kumar KP", email = "vinod.kunnum-purath@capgemini.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agent", "oai_agent_evaluator"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml",
    "markdown",
    "litellm",
    "boto3",
    "oai-agent-core"
]

[project.optional-dependencies]
faker = ["faker"]
pdf = ["pypdf"]
docx = ["python-docx"]
ppt = ["python-pptx"]
excel = ["pandas", "openpyxl"]
ocr = ["pillow", "pytesseract"]
macros = ["faker", "pypdf", "python-docx", "python-pptx", "pandas", "openpyxl", "pillow", "pytesseract"]

[project.scripts]
oai-agent-evaluator = "oai_agent_evaluator.cli:main"

[project.urls]
Homepage = "https://github.com/Capgemini-Innersource/ptr_oai_langgraph_agent_core"
Repository = "https://github.com/Capgemini-Innersource/ptr_oai_langgraph_agent_core.git"
Issues = "https://github.com/Capgemini-Innersource/ptr_oai_langgraph_agent_core/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/oai_agent_core"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "strict"
