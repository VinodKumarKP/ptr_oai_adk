[project]
name = "ptr-oai-adk-workspace"
version = "0.1.0"
description = "Monorepo workspace for OAI Agent Core and related packages"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# Shared libraries — referenced as deps by other workspace members.
# Add a new entry here whenever a package becomes a dep of a sibling.
oai-agent-core      = { workspace = true }
oai-platform-core   = { workspace = true }
oai-mcp-server-core = { workspace = true }   # not yet consumed, but a likely future dep

# Legacy / preemptive entries (harmless)
oai-langgraph-core  = { workspace = true }
oai-openai-core     = { workspace = true }
